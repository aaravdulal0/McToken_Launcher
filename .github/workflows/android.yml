name: Build McToken Launcher

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install unzip
      run: sudo apt-get install unzip -y

    - name: Merge ZIP parts
      run: |
        cat app_pojavlauncher.zip.* > app_pojavlauncher.zip || true

    - name: Extract app
      run: unzip app_pojavlauncher.zip || true

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Permission
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug
